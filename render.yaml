# Render Blueprint: one free Docker web service serving the API and the frontend.
services:
  - type: web
    name: ai-startup-due-diligence-platform
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: UPLOAD_TTL_SECONDS
        value: "7200"
